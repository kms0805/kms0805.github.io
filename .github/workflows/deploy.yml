name: Deploy site

on:
  # Deploy on any change EXCEPT the files below. An allow-list was used here
  # before and silently skipped deploys whenever a new source directory
  # appeared (it happened with _sass and again with _bibliography), so the
  # filter is inverted: anything that is not listed here rebuilds the site.
  push:
    branches:
      - master
      - main
    paths-ignore:
      - ".claude/**"
      - ".github/workflows/broken-links.yml"
      - ".github/workflows/broken-links-site.yml"
      - ".github/workflows/prettier.yml"
      - ".github/workflows/prettier-comment-on-pr.yml"
      - ".git-blame-ignore-revs"
      - ".pre-commit-config.yaml"
      - ".prettierignore"
      - ".prettierrc"
      - "CLAUDE.md"
      - "LICENSE"
      - "README.md"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - master
      - main
    # Keep in sync with the push filter above (Actions does not support YAML anchors).
    paths-ignore:
      - ".claude/**"
      - ".github/workflows/broken-links.yml"
      - ".github/workflows/broken-links-site.yml"
      - ".github/workflows/prettier.yml"
      - ".github/workflows/prettier-comment-on-pr.yml"
      - ".git-blame-ignore-revs"
      - ".pre-commit-config.yaml"
      - ".prettierignore"
      - ".prettierrc"
      - "CLAUDE.md"
      - "LICENSE"
      - "README.md"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install ImageMagick 🖼️
        run: sudo apt-get install -y imagemagick
      - name: Install and Build 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build --lsi
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
