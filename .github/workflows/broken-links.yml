name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "**/*.md"
      - "**.html"
      - "**.liquid"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "**/*.md"
      - "**.html"
      - "**.liquid"
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # _pages/404.md contains Liquid tags that lychee cannot resolve.
          # milab.snu.ac.kr resolves in a browser but resets the connection for
          # CI runners, so it is checked by hand rather than reported as broken.
          args: >-
            --exclude-path _pages/404.md
            --exclude '^https?://milab\.snu\.ac\.kr'
            --exclude-loopback
            --verbose --no-progress
            './**/*.md' './**/*.html'
